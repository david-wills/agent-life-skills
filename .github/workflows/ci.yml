name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Third-party imports needed by --help
        run: python -m pip install -q -r news-triage-assistant/morning-news/requirements.txt
      - name: Byte-compile everything
        run: python -m compileall -q . -x '\.git'
      - name: Tests
        run: python -m unittest discover -s tests -v
