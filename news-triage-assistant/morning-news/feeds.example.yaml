# Feed list — example. Copy to feeds.local.yaml and make it yours.
#
# feeds.local.yaml is gitignored; this file is the published template. The two
# are separate for the same reason profile.local.md is: which outlets you read
# says something about you, and a repo someone clones should start from a
# neutral list rather than inherit one.
#
# Only free, public RSS endpoints belong here. Nothing in this pipeline
# authenticates to a publisher, so a subscriber-only feed will simply fail.
#
# priority: decides which outlet wins when the same story arrives from several
# feeds, and the order links are listed on a clustered bullet. First wins. A
# source missing from this list sorts last rather than erroring.
#
# Add your own interests as extra entries — a local paper, a trade publication,
# a hobby blog. Give each a `source` name, a `section` label, and the feed url:
#
#   - source: Your City Times
#     section: Local
#     url: https://example.com/local/rss
#
# Then add a matching theme to profile.local.md, or the stories will be fetched
# and dropped for having nowhere to go.

priority:
- WSJ
- NYT
- WaPo
- The Verge
- TechCrunch
- Stratechery
- OpenAI
- Google DeepMind
- Google Research
